[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.build]
cmds = [
  "cd frontend && npm install && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/",
  "pip install -r backend/requirements.txt"
]

[start]
cmd = "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
